<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صنوبر · استبيان الورشة</title>
<meta name="description" content="ستة أجزاء قصيرة لنفهم كيف تسير ورشتك، لنبني لك ما يساعدك فعلًا.">
<meta name="theme-color" content="#3e2a20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Snouber's light theme (src/app/globals.css :root): Wengé, walnut, white melamine. */
  :root {
    --background: #f7f1e6;
    --foreground: #3e2a20;
    --card: #fffcf6;
    --primary: #3e2a20;
    --primary-foreground: #f7f1e6;
    --muted: #f0e8db;
    --muted-foreground: #6b5d52;
    --accent: #f1e3cc;
    --border: #e6dccb;
    --input: #dccfbb;
    --wood: #8a5a36;
    --destructive: oklch(0.55 0.2 27);
    --snouber-tree: #d2a86e;
    --snouber-edge: #b07f45;
    --snouber-trunk: #8a5a36;
    --snouber-eye: #3e2a20;
    --whatsapp: #1f8f4e;
    --radius: 0.625rem;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 32px; min-height: 100dvh; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 12px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; color: var(--primary); }
  .brand svg { width: 30px; height: 30px; }
  .count { font-size: 14px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; text-align: end; }

  .bar { height: 6px; border-radius: 99px; background: var(--muted); overflow: hidden; margin-bottom: 20px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--wood); border-radius: 99px; transition: width 300ms ease; }

  main { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.8); padding: 22px 18px; }
  .step { animation: enter 260ms ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .snouber { display: block; width: 92px; height: 92px; margin: 4px auto 12px; }
  h1 { font-size: 24px; line-height: 1.4; margin: 0 0 10px; text-align: center; }
  h2 { font-size: 21px; line-height: 1.45; margin: 0 0 6px; }
  .lead { color: var(--muted-foreground); margin: 0 0 8px; text-align: center; }
  .hint { color: var(--muted-foreground); font-size: 14px; margin: 0 0 14px; }
  .tag { display: inline-block; font-size: 13px; color: var(--wood); font-weight: 600; margin-bottom: 6px; }

  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%;
    font: inherit; color: inherit; text-align: start;
    background: var(--background); border: 1.5px solid var(--input); border-radius: var(--radius);
    padding: 12px 14px; min-height: 52px; cursor: pointer;
    transition: border-color 150ms, background 150ms;
  }
  .opt .box { flex: none; width: 22px; height: 22px; border: 2px solid var(--input); display: grid; place-items: center; background: var(--card); }
  .opt[data-kind="multi"] .box { border-radius: 6px; }
  .opt[data-kind="single"] .box { border-radius: 50%; }
  .opt[aria-checked="true"] { border-color: var(--primary); background: var(--accent); }
  .opt[aria-checked="true"] .box { border-color: var(--primary); background: var(--primary); }
  .opt[aria-checked="true"] .box::after { content: ""; width: 10px; height: 10px; border-radius: inherit; background: var(--primary-foreground); }
  .opt[data-kind="multi"][aria-checked="true"] .box::after { width: 6px; height: 11px; border-radius: 0; background: none; border: solid var(--primary-foreground); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .opt:focus-visible, textarea:focus-visible, input:focus-visible, .btn:focus-visible { outline: 3px solid var(--wood); outline-offset: 2px; }

  label.follow { display: block; font-weight: 600; margin: 18px 0 6px; }
  textarea, input[type="text"] {
    width: 100%; font: inherit; color: inherit; background: var(--background);
    border: 1.5px solid var(--input); border-radius: var(--radius); padding: 12px 14px;
  }
  textarea { min-height: 120px; resize: vertical; }
  .other-input { margin-top: 10px; }
  .error { color: var(--destructive); font-size: 15px; margin: 12px 0 0; min-height: 1.6em; }

  .rec { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .rec-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    min-height: 58px; padding: 12px 16px; cursor: pointer; text-decoration: none;
    font: inherit; font-weight: 600; font-size: 18px;
    color: var(--primary-foreground); background: var(--wood); border: 0; border-radius: var(--radius);
  }
  .rec-btn svg { width: 24px; height: 24px; flex: none; }
  .rec-btn.on { background: var(--primary); }
  .rec-btn.ghost { min-height: 48px; font-size: 16px; color: var(--wood); background: transparent; border: 1.5px solid var(--wood); }
  .rec-btn .dot { width: 12px; height: 12px; border-radius: 50%; background: #e0574a; animation: pulse 1s ease-in-out infinite; }
  .rec-btn .time { font-variant-numeric: tabular-nums; opacity: 0.85; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .rec audio { width: 100%; }
  .rec-ok { margin: 0; color: var(--wood); font-weight: 600; font-size: 15px; }
  .rec-ok:empty { display: none; }
  .rec-note { margin: 0; font-size: 14px; color: var(--muted-foreground); text-align: center; }
  .rec-err { margin: 0; font-size: 15px; color: var(--destructive); }
  .or { text-align: center; font-size: 13px; color: var(--muted-foreground); margin: 10px 0 6px; }
  .lead.sent { color: var(--wood); font-weight: 600; }

  nav { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    font: inherit; font-weight: 600; border: 0; border-radius: var(--radius);
    padding: 14px 18px; min-height: 54px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  }
  .btn.primary { flex: 1; background: var(--primary); color: var(--primary-foreground); }
  .btn.ghost { background: transparent; color: var(--muted-foreground); border: 1.5px solid var(--border); }
  .btn.wa { width: 100%; background: var(--whatsapp); color: #fff; font-size: 18px; margin-top: 16px; }
  .btn svg { width: 22px; height: 22px; flex: none; }

  .parts { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .parts button {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
    font: inherit; color: inherit; text-align: start; cursor: pointer;
    background: var(--background); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 11px 14px;
  }
  .parts .state { font-size: 14px; color: var(--muted-foreground); white-space: nowrap; }
  .parts .state.sent { color: var(--wood); font-weight: 600; }

  .after { margin-top: 18px; padding: 14px; border-radius: var(--radius); background: var(--muted); }
  .after p { margin: 0 0 8px; }
  .after p:last-child { margin: 0; }
  .after strong { color: var(--primary); }
  footer { text-align: center; font-size: 13px; color: var(--muted-foreground); margin-top: 22px; }

  @media (prefers-reduced-motion: reduce) {
    .step { animation: none; }
    .bar > i, .opt { transition: none; }
    .rec-btn .dot { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand"><span id="brand-mark"></span>صنوبر</span>
    <span class="count" id="count" aria-live="polite"></span>
  </header>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <main id="app"></main>
  <footer>إجاباتك وتسجيلاتك تصل إلى فريق صنوبر وحده، أولًا بأول. لا نعرضها على أحد، ونحذفها بعد أن نقرأها ونسمعها.</footer>
</div>

<script>
(function () {
  // Answers, voice notes and photos go to save.php (next to this page), little by little, as he answers.
  // WhatsApp (Snouber's business number, 0563133068) is only the way out when that fails or the phone cannot record.
  var WHATSAPP = "213563133068";
  var STORE = "snouber-workshop-survey-v4";

  // The questions that decide the MVP (docs/product/workshops.md, section 8; the hypothesis number in "h").
  // kind: "single" (one choice), "multi" (several), "text". "follow": an optional line under the choices.
  // "voice": record the answer in the page. "photo": add photos. "showIf": asked only when
  // the answer to another question is not one of the listed choices.
  var PARTS = [
    { title: "الورشة", minutes: 1, questions: [
      { id: "makes", kind: "multi", title: "ماذا تصنع أكثر؟", hint: "اختر كل ما ينطبق.",
        options: ["مطابخ", "دريسينغ", "غرف نوم", "أبواب", "أثاث مكاتب أو محلات"], other: "شيء آخر" },
      { id: "partner", kind: "single", title: "هل لك شريك في الورشة؟", h: 12,
        options: ["لا", "شريك واحد", "أكثر من شريك"] }
    ]},
    { title: "عرض السعر والدفع", minutes: 3, questions: [
      { id: "price_by", kind: "multi", title: "كيف تحسب السعر في عرض السعر (الدوفي)؟", hint: "اختر كل ما ينطبق.",
        options: ["بالمتر الطولي", "بالمتر المربع", "قطعة قطعة (خزانة، باب، درج…)", "مبلغ واحد للمشروع كله"], other: "طريقة أخرى" },
      { id: "devis_how", kind: "single", title: "كيف تكتب عرض السعر اليوم؟", h: 1, photo: true,
        hint: "إن كانت عندك صورة عرض سعر قديم، أضفها هنا دون اسم الزبون. تساعدنا كثيرًا.",
        options: ["باليد على ورقة", "في Word أو Excel", "في تطبيق في الهاتف", "لا أكتبه، نتفق بالكلام"], other: "طريقة أخرى" },
      { id: "pay_how", kind: "multi", title: "كيف يدفع لك الزبون عادة؟", h: 3, hint: "اختر كل ما ينطبق.",
        options: ["عربون، ثم الباقي عند التسليم", "عربون، ثم الباقي على دفعات", "كل المبلغ مرة واحدة"], other: "طريقة أخرى" },
      { id: "forgot_payment", kind: "single", title: "هل نسيت مرة دفعة، أو اختلفت مع زبون على ما دفعه؟", h: 4,
        options: ["نعم، هذه السنة", "نعم، من قبل", "لا، أبدًا"],
        follow: "ماذا حدث؟", voice: true }
    ]},
    { title: "الربح والتسليم", minutes: 3, questions: [
      { id: "costs", kind: "multi", title: "ما المصاريف التي تدخل في مشروع واحد؟", h: 2, hint: "اختر كل ما ينطبق.",
        options: ["الألواح", "الإكسسوار (مفصلات، مقابض، سكك…)", "التقطيع والحواف", "أجرة العمال", "النقل", "التركيب عند الزبون"], other: "شيء آخر" },
      { id: "profit_know", kind: "single", title: "في آخر مشروع سلّمته، هل تعرف كم ربحت؟", h: 2,
        options: ["نعم، بالضبط", "تقريبًا", "لا أعرف"],
        follow: "كيف حسبته؟", voice: true },
      { id: "late_count", kind: "single", title: "هذه السنة، كم مشروعًا تأخر عن موعد التسليم؟", h: 5,
        options: ["لا شيء", "1 أو 2", "من 3 إلى 5", "أكثر من 5", "لا أعرف"] },
      { id: "changed", kind: "single", title: "حين يغيّر الزبون شيئًا بعد عرض السعر (لون، مقاس، إضافة)، ماذا تفعل؟", h: 6,
        options: ["نادرًا ما يغيّر", "أزيد في السعر وأكتبه", "أزيد في السعر بالكلام فقط", "أتحمّل الفرق أنا"], other: "شيء آخر" }
    ]},
    { title: "التصميم والتكلفة والأسعار", minutes: 4, questions: [
      { id: "biggest", kind: "multi", required: true,
        title: "من هذه الأمور، ما الذي يأخذ منك وقتًا أو مالًا أكثر؟",
        hint: "اختر ثلاثة على الأكثر: الأكبر فقط.", max: 3,
        options: ["أن أُري الزبون شكل ما سأصنعه قبل البدء", "حساب التكلفة وكتابة عرض السعر",
          "معرفة أسعار الألواح والإكسسوار اليوم", "حساب الألواح اللازمة والتقطيع (الضياع)", "أخطاء القياس",
          "إيجاد زبائن جدد", "العمال (إيجادهم، غيابهم، مستواهم)", "متابعة المال: من دفع ومن بقي عليه",
          "التأخر في التسليم"], other: "شيء آخر" },
      { id: "show_design", kind: "multi", title: "كيف تُري الزبون ما ستصنعه له قبل أن تبدأ؟", hint: "اختر كل ما ينطبق.",
        options: ["رسم باليد", "صور أعمال سابقة لي", "صور من الإنترنت أو إنستغرام",
          "برنامج تصميم بالأبعاد الثلاثة", "يأتي إلى الورشة ويرى", "لا شيء، نتفق بالكلام"], other: "طريقة أخرى",
        follow: "هل خسرت زبونًا، أو أعدت عملًا، لأن الزبون تخيّل شيئًا آخر؟ احكِ لنا.", voice: true },
      { id: "cost_calc", kind: "single", title: "حين تكتب عرض السعر، كيف تعرف كم ستكلفك الألواح والإكسسوار؟",
        options: ["أحسب عدد الألواح بنفسي على ورقة", "أرسل المقاسات للتاجر فيحسبها", "ببرنامج تقطيع",
          "بالخبرة، تقريبًا"], other: "طريقة أخرى",
        follow: "كم يأخذ منك هذا الحساب؟ وهل أخطأت فيه مرة؟", voice: true },
      { id: "prices_know", kind: "multi", title: "كيف تعرف أسعار الألواح والإكسسوار اليوم؟", h: 7, hint: "اختر كل ما ينطبق.",
        options: ["أتصل بالتاجر", "أذهب إلى المحل", "مجموعات فيسبوك أو واتساب", "من آخر شراء لي",
          "لا أعرفها حتى أشتري"], other: "طريقة أخرى" },
      { id: "prices_change", kind: "single", title: "كم مرة تتغير أسعار الألواح والإكسسوار؟", h: 7,
        options: ["كل أسبوع تقريبًا", "كل شهر تقريبًا", "بضع مرات في السنة", "نادرًا"],
        follow: "ماذا تفعل حين يرتفع السعر بعد أن أعطيت الزبون عرض السعر؟", voice: true }
    ]},
    { title: "الختام", minutes: 4, questions: [
      { id: "tools", kind: "multi", title: "ماذا تستعمل اليوم لحسابات الورشة؟", photo: true,
        hint: "اختر كل ما ينطبق. وإن كان عندك دفتر، صوّر صفحة منه دون أسماء وأضفها هنا.",
        options: ["دفتر", "أوراق متفرقة", "Word أو Excel", "تطبيق في الهاتف", "لا شيء"], other: "شيء آخر" },
      { id: "most_tiring", kind: "text", voice: true, required: true,
        title: "ما أكثر شيء يتعبك في الأسبوع، غير العمل بيدك؟" },
      { id: "story", kind: "text", voice: true,
        title: "احكِ لنا قصة آخر مشروع سلّمته، من أول اتصال إلى آخر دفعة. ما الذي أتعبك فيه؟",
        hint: "اختياري، لكنه يساعدنا كثيرًا. الأسهل أن تسجّلها بصوتك." },
      { id: "missed", kind: "text", voice: true,
        title: "ما المشكلة الكبيرة عند أصحاب الورشات التي لم نسألك عنها؟",
        hint: "أنت تعرف هذا العمل أكثر منا. قل لنا ما فاتنا." }
    ]}
  ];

  // Flatten: one screen per question, numbered across the whole survey.
  var ALL = [];
  PARTS.forEach(function (p, pi) {
    p.questions.forEach(function (q) { q.part = pi; q.n = ALL.length + 1; ALL.push(q); });
  });
  var TOTAL = ALL.length;

  var app = document.getElementById("app");
  var bar = document.getElementById("bar");
  var count = document.getElementById("count");

  // Screens: {type:"welcome"} | {type:"q", i} | {type:"end"}
  var state = load() || { screen: { type: "welcome" }, answers: {}, started: false };
  if (!state.sid) state.sid = newId();

  function newId() {
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
  }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(STORE)); return s && s.answers && s.screen ? s : null; } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* private mode: answers stay in memory */ }
  }
  // Something he typed or picked: kept on the phone now, sent with the next sync.
  function changed() { state.dirty = true; save(); }
  function answer(id) {
    if (!state.answers[id]) state.answers[id] = { picked: [], other: "", text: "", voice: false, photos: 0 };
    return state.answers[id];
  }
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  // ---- Files (voice notes, photos): kept on the phone in IndexedDB until they reach us. ----
  // Keys: "voice|<question id>" (one per question, a new recording replaces it) and "photo|<question id>|<stamp>".
  var MEM = {};
  var DBP = null;
  function db() {
    if (!DBP) DBP = new Promise(function (res, rej) {
      if (!window.indexedDB) return rej(new Error("no indexedDB"));
      var r = indexedDB.open("snouber-workshop-files", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("files"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    return DBP;
  }
  function idb(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction("files", mode);
        var req = fn(tx.objectStore("files"));
        tx.oncomplete = function () { res(req ? req.result : undefined); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function putFile(key, rec) {
    MEM[key] = rec;
    return idb("readwrite", function (s) { s.put(rec, key); }).catch(function () { /* memory copy only */ });
  }
  function getFile(key) {
    if (MEM[key]) return Promise.resolve(MEM[key]);
    return idb("readonly", function (s) { return s.get(key); }).catch(function () { return undefined; });
  }
  function fileKeys() {
    return idb("readonly", function (s) { return s.getAllKeys(); }).catch(function () { return []; }).then(function (keys) {
      keys = (keys || []).slice();
      Object.keys(MEM).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
      return keys;
    });
  }

  // ---- Sending: everything goes to save.php next to this page, little by little, in the background. ----
  var RECEIVER = "save.php";
  var syncing = false, syncAgain = false, lastSync = null;

  function post(fd) {
    return fetch(RECEIVER, { method: "POST", body: fd }).then(function (r) {
      return r.json().catch(function () { return { ok: false }; }).then(function (j) {
        if (!r.ok || !j.ok) throw new Error((j && j.error) || "http " + r.status);
        return j;
      });
    });
  }
  function sendAnswers() {
    state.dirty = false; save();
    var fd = new FormData();
    fd.append("sid", state.sid);
    fd.append("kind", "answers");
    fd.append("answers", JSON.stringify(report()));
    return post(fd).catch(function (e) { state.dirty = true; save(); throw e; });
  }
  function ext(type) {
    if (/webm/.test(type)) return "webm";
    if (/ogg/.test(type)) return "ogg";
    if (/mp4|m4a|aac/.test(type)) return "m4a";
    if (/png/.test(type)) return "png";
    if (/webp/.test(type)) return "webp";
    if (/hei[cf]/.test(type)) return "heic";
    return "jpg";
  }
  function sendFiles() {

  // What reaches us: every question with its answer, and the same as plain text to read.
  function report() {
    return {
      survey: "workshop-v1",
      sid: state.sid,
      updated: new Date().toISOString(),
      finished: !!state.finished,
      answers: ALL.map(function (q) {
        var a = state.answers[q.id] || {};
        return { n: q.n, part: PARTS[q.part].title, id: q.id, title: q.title, asked: shown(q),
          picked: a.picked || [], other: a.other || "", text: a.text || "", voice: !!a.voice, photos: a.photos || 0 };

  function readable() {
    var lines = ["استبيان الورشة" + (state.finished ? " (أنهاه)" : " (لم ينهه بعد)"), ""];
    PARTS.forEach(function (p, pi) {
      lines.push("=== الجزء " + (pi + 1) + ": " + p.title + " ===", "");
      p.questions.forEach(function (q) {
        if (!shown(q)) return;
        var a = state.answers[q.id] || { picked: [], other: "", text: "" };
        var out = [];
        if (q.kind !== "text") {
          var picked = (a.picked || []).map(function (x) { return x === q.other && (a.other || "").trim() ? q.other + ": " + a.other.trim() : x; });
          if (picked.length) out.push(picked.join("، "));
          if (q.follow && (a.text || "").trim()) out.push(q.follow + " " + a.text.trim());
        } else if ((a.text || "").trim()) {
          out.push(a.text.trim());
        }
        if (a.voice) out.push("[تسجيل صوتي: voice-" + q.id + "]");

        lines.push("");

  var MIC_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>';
  var CAM_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

  // ---- Recording in the page (MediaRecorder). One recording at a time. ----
  var CAN_RECORD = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  var MAX_RECORDING_MS = 10 * 60 * 1000;
  var REC = null;

  function pickType() {
    var types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
    for (var i = 0; i < types.length; i++) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) return types[i];
    }
    return "";
  }
  function clock(ms) {
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }
  function tick() {
    if (REC && REC.ui) REC.ui.textContent = clock(Date.now() - REC.start);
  }
  function stopRec() {
    if (REC && REC.mr.state !== "inactive") { clearTimeout(REC.max); REC.mr.stop(); }
  }
  function startRec(q, a, redraw, fail) {
    stopRec();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var type = pickType();
      var opts = { audioBitsPerSecond: 32000 };
      if (type) opts.mimeType = type;
      var mr;
      try { mr = new MediaRecorder(stream, opts); } catch (e) { mr = new MediaRecorder(stream); }
      var chunks = [];
      REC = { mr: mr, qid: q.id, start: Date.now(), ui: null };
      mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        clearInterval(REC && REC.timer);
        var took = REC ? Date.now() - REC.start : 0;
        REC = null;
        var blob = new Blob(chunks, { type: mr.mimeType || type || "audio/webm" });
        if (took < 1500 || blob.size < 1000) { redraw("قصير جدًا: اضغط مرة أخرى وتكلّم، ثم اضغط «أوقف»."); return; }
        putFile("voice|" + q.id, { blob: blob, type: blob.type, ts: Date.now(), uploaded: false }).then(function () {
          a.voice = true;
          changed();
          redraw();
          sync();
        });
      };
      mr.start(1000);
      REC.timer = setInterval(tick, 500);
      REC.max = setTimeout(stopRec, MAX_RECORDING_MS);

      fail("لم يُفتح الميكروفون. اسمح للصفحة باستعمال الميكروفون (من القفل بجانب الرابط)، ثم اضغط مرة أخرى. أو اكتب جوابك.");
    });
  }

  function recorder(q, a, onAnswer) {
    var box = el("div", { class: "rec" });

      // Old phones: the voice note goes through WhatsApp instead.

      link.innerHTML = MIC_ICON + "<span>أجب بصوتك على واتساب</span>";
      link.addEventListener("click", function () { a.voice = true; changed(); if (onAnswer) onAnswer(); });
      box.appendChild(link);
      return box;
    }
    function draw(message) {
      box.innerHTML = "";
      if (REC && REC.qid === q.id) {
        var stop = el("button", { class: "rec-btn on", type: "button" });
        stop.innerHTML = '<span class="dot" aria-hidden="true"></span><span>أوقف التسجيل</span><span class="time">0:00</span>';
        stop.addEventListener("click", stopRec);
        REC.ui = stop.querySelector(".time");

        box.appendChild(stop);
        box.appendChild(el("p", { class: "rec-note", text: "تكلّم براحتك، ثم اضغط «أوقف التسجيل»." }));
        return;
      }
      getFile("voice|" + q.id).then(function (rec) {
        if (REC && REC.qid === q.id) return;
        box.innerHTML = "";
        if (rec) {
          box.appendChild(el("p", { class: "rec-ok", text: rec.uploaded ? "✓ وصلنا تسجيلك" : "✓ حُفظ تسجيلك، ويُرسل وحده" }));
          var au = el("audio", { controls: "", preload: "metadata" });
          au.src = URL.createObjectURL(rec.blob);
          box.appendChild(au);
          var again = el("button", { class: "rec-btn ghost", type: "button" });

          again.addEventListener("click", start);

          var go = el("button", { class: "rec-btn", type: "button" });

          go.addEventListener("click", start);

    draw();
    return box;
  }

  function photoPicker(q, a) {
    var box = el("div", { class: "rec" });

    var btn = el("button", { class: "rec-btn ghost", type: "button" });

      fileKeys().then(function (keys) {
        var mine = keys.filter(function (k) { return k.indexOf("photo|" + q.id + "|") === 0; });
        return Promise.all(mine.map(getFile));
      }).then(function (recs) {
        var n = recs.length;

    ];
    if (lastSync === "failed" && !syncing) {
      body.push(el("button", { class: "btn primary", type: "button", style: "width:100%;margin-top:12px", text: "أعد الإرسال", onclick: sync }));
      var wa = el("a", { class: "btn wa", href: "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(readable()), target: "_blank", rel: "noopener" });
      wa.innerHTML = WA_ICON + "<span>أو أرسل إجاباتك المكتوبة عبر واتساب</span>";
      body.push(wa);
    }
    app.appendChild(el("section", { class: "card step" }, body));
    app.appendChild(el("nav", {}, [
      el("button", { class: "btn ghost", type: "button", style: "flex:1", text: "رجوع لتعديل إجاباتي", onclick: function () { go({ type: "q", i: lastShown() }); } }),
      el("button", { class: "btn ghost", type: "button", style: "flex:1", text: "كل الأجزاء", onclick: function () { go({ type: "welcome" }); } })
    ]));
  }

  function go(screen) {
    stopRec();
    if (screen.type === "end" && !state.finished) { state.finished = true; state.dirty = true; }
    state.screen = screen;
    if (screen.type === "q") state.last = screen;
    save();
    render();
    window.scrollTo(0, 0);
    sync();
  }

  render();
  sync();
})();
</script>
</body>
</html>
